
<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Tạo responsive</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .left, .right {
            height: 400px;
        }

        .left {
            background: blue;
            float: left;
            width: 70%;
        }

        .right {
            background: red;
            float: right;
            width: 30%;
        }

        /* Hình ảnh Responsive */
        picture img {
            display: block;
            width: 400px;
            max-width: 100%;
            height: auto;
        }

        /* Responsive khi màn hình nhỏ hơn hoặc bằng 768px */
        @media only screen and (max-width: 768px) {
            .left, .right {
                float: none;
                width: 100%;
            }
        }

        /* Nếu chiều rộng trình duyệt từ 321px đến 479px
           thì ẩn class Right */
        @media only screen and (max-width: 479px) and (min-width: 321px) {
            .right {
                display: none;
            }
        }

        /* Nếu ở chế độ máy in thì ẩn class Left */
        @media only print {
            .left {
                display: none;
            }

            .right {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="left">
            LEFT

            <picture>
                <source
                    media="(min-width: 960px)"
                    srcset="https://www.ueh.edu.vn/images/logo-header.png">

                <source
                    media="(min-width: 480px)"
                    srcset="https://ctd.ueh.edu.vn/wp-content/uploads/2023/07/cropped-TV_trang_CTD.png">

                <img
                    src="https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png"
                    alt="Logo UEH">
            </picture>
        </div>

        <div class="right">
            RIGHT
        </div>

    </div>
</body>
</html>
